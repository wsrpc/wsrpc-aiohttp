version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    install:
      - pip install uv
      - uv sync --locked --only-group docs
    build:
      html:
        - uv run --locked --no-dev --group docs sphinx-build -W --keep-going -b html docs/source $READTHEDOCS_OUTPUT/html
sphinx:
  configuration: docs/source/conf.py

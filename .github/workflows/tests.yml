name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytask -k "lint or typing or docs or build"

  tests:
    runs-on: ${{ matrix.os }}
    env:
      WSRPC_EXPECT_FREE_THREADED: ${{ endsWith(matrix.python, 't') && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.13t", "3.14t", "3.15t"]
        include:
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Verify free-threaded runtime
        if: endsWith(matrix.python, 't')
        run: uv run --locked python -c "import sys, wsrpc_aiohttp; assert not sys._is_gil_enabled()"
      - run: uv run --locked pytask -k tests
      - name: Test custom JSON codecs
        if: ${{ !endsWith(matrix.python, 't') }}
        run: uv run --locked --group serializers pytask -k tests

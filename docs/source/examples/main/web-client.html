<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WSRPC quick start</title>
  <script src="/js/wsrpc.min.js"></script>
</head>
<body>
  <label>UUID <input id="result" readonly></label>
  <button id="generate" type="button">Generate UUID</button>
  <p id="error" role="alert"></p>
  <script>
    const url = new URL("/ws/", window.location.href);
    url.protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const rpc = new WSRPC(url.toString());
    rpc.connect();

    document.getElementById("generate").addEventListener("click", async () => {
      document.getElementById("error").textContent = "";
      try {
        document.getElementById("result").value = await rpc.call("uuid4");
      } catch (error) {
        document.getElementById("error").textContent = error.message || String(error);
      }
    });
  </script>
</body>
</html>
